<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis giros de hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Heebo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B35}a:hover{color:#123E8C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Heebo', system-ui, sans-serif; color: #2C3E50; background: #F7FBF4; display: flex; flex-direction: column; padding: 24px 20px 20px">
  <div style="position: absolute; left: -80px; right: -80px; bottom: -300px; height: 420px; border-radius: 50%; background: #2E8B47"></div>
  <div style="position: absolute; left: -40px; right: -120px; bottom: -340px; height: 420px; border-radius: 50%; background: #1F6B35"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 10px">
    <a href="F2-Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(31,107,53,.12)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#123E8C" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px; color: #123E8C">Mis giros de hoy</h1>
  </div>

  <div style="position: relative; margin-top: 18px; background: #123E8C; border-radius: 24px; padding: 18px 20px; color: #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #C9D6F2">Giros</div>
      <div style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px">[#]</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #C9D6F2">Entregado</div>
      <div style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px; color: #FFD966">$[MONTO]</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #C9D6F2">Premio mayor</div>
      <div style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px">$[MONTO]</div>
    </div>
  </div>

  <div style="position: relative; margin-top: 16px; display: flex; gap: 8px">
    <button style="height: 40px; padding: 0 16px; border: none; border-radius: 999px; background: #2E8B47; color: #FFFFFF; font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">Hoy</button>
    <button style="height: 40px; padding: 0 16px; border: 2px solid #CFEFC9; border-radius: 999px; background: #FFFFFF; color: #2C3E50; font-family: 'Heebo', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Esta semana</button>
    <button style="height: 40px; padding: 0 16px; border: 2px solid #CFEFC9; border-radius: 999px; background: #FFFFFF; color: #2C3E50; font-family: 'Heebo', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Este mes</button>
  </div>

  <div style="position: relative; margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(31,107,53,.08)">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: {{r.bg}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px">$</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
          <div style="font-weight: 600; font-size: 15px">[CLIENTE]</div>
          <div style="font-size: 12px; color: #3D5A3F">[HORA] · Código [CODIGO]</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
          <div style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; color: #123E8C">{{r.amount}}</div>
          <div style="font-size: 11px; font-weight: 700; color: #1F6B35; background: #CFEFC9; border-radius: 999px; padding: 2px 8px">Enviado</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <nav style="position: relative; background: #FFFFFF; border-radius: 24px; height: 68px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.18)">
    <a href="F2-Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #3D5A3F; text-decoration: none; min-width: 64px; padding: 6px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D5A3F" stroke-width="2.2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="F3-Cliente.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #3D5A3F; text-decoration: none; min-width: 64px; padding: 6px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D5A3F" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Nuevo giro</a>
    <a href="F6-Historial.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: #2E8B47; text-decoration: none; min-width: 64px; padding: 6px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E8B47" stroke-width="2.2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Historial</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = ['$50', '$25', '$10', '$100', '$5'];
    const c = [['#F2B705','#0A1F4A'], ['#CFEFC9','#1F6B35'], ['#CFEFC9','#1F6B35'], ['#123E8C','#FFFFFF'], ['#CFEFC9','#1F6B35']];
    return { rows: a.map((amount, i) => ({ amount, bg: c[i][0], ink: c[i][1] })) };
  }
}
</script>
</body>
</html>
