# Corre el build de ./dist con la imagen oficial de Node: no se construye ninguna imagen.
# Flujo en el servidor:
#   git pull
#   docker-compose run --rm build     (genera dist/ dentro de un contenedor)
#   docker-compose restart web
# `version` es necesario para docker-compose v1; con `docker compose` (v2) se ignora.
version: "3"

services:
  web:
    image: node:22-alpine
    container_name: cn_credinstante-ruleta
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    volumes:
      - ./dist:/app:ro
    tmpfs:
      - /app/.next/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Tarea puntual: instala dependencias y arma dist/. No arranca con `up`.
  build:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /src
    command: ["sh", "-c", "npm ci && npm run build:dist"]
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - ./:/src
      - npm-cache:/root/.npm

volumes:
  npm-cache:
