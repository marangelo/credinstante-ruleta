<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ruleta Árbol que Crece</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Heebo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B35}a:hover{color:#123E8C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Heebo', system-ui, sans-serif; color: #0A1F4A; background: #F7FBF4; display: flex; flex-direction: column; align-items: center; padding: 26px 22px 24px">
  <div style="position: absolute; left: -80px; right: -80px; bottom: -260px; height: 420px; border-radius: 50%; background: #2E8B47"></div>
  <div style="position: absolute; left: -40px; right: -120px; bottom: -300px; height: 420px; border-radius: 50%; background: #1F6B35"></div>

  <div style="display: flex; width: 100%; justify-content: space-between; align-items: center; position: relative">
    <img src="/_blob/00057d2c0108ccd86df8a17eb0c7b52b" alt="Credinstante" style="width: 64px; height: 64px; object-fit: contain">
    <div style="background: #FFFFFF; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #1F6B35; box-shadow: 0 4px 14px rgba(31,107,53,.15)">Hola, [NOMBRE]</div>
  </div>

  <div style="text-align: center; position: relative; margin-top: 10px">
    <h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; color: #123E8C">¡Tu suerte<br><span style="color: #2E8B47">está creciendo!</span></h1>
    <p style="margin: 8px 0 0; font-size: 14px; color: #3D5A3F">Cada pago puntual te regala un giro</p>
    <div style="position: relative; margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; background: #86B817; color: #2C3E50; border-radius: 999px; padding: 5px 14px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px">Creciendo con vos</div>
  </div>

  <div style="position: relative; width: 330px; height: 330px; margin-top: 22px; flex-shrink: 0">
    <sc-for list="{{leaves}}" as="l" hint-placeholder-count="16">
      <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate({{l.deg}}deg)">
        <svg width="34" height="22" viewBox="0 0 34 22" style="position: absolute; left: -17px; top: -182px" aria-hidden="true"><path d="M2 11 C 8 0, 26 0, 32 11 C 26 22, 8 22, 2 11 Z" fill="{{l.fill}}"></path><text x="17" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="Heebo, sans-serif">$</text></svg>
      </div>
    </sc-for>
    <div style="position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 16px 40px rgba(31,107,53,.28)"></div>
    <div style="position: absolute; inset: 10px; border-radius: 50%; overflow: hidden; border: 4px solid #F2B705; transform: rotate(-10deg); background: {{conic}}">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="8">
        <div style="position: absolute; inset: 0; transform: rotate({{s.mid}}deg); display: flex; justify-content: center">
          <div style="margin-top: 20px; width: 80px; text-align: center; color: {{s.ink}}">
            <div style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; line-height: 1">{{s.big}}</div>
            <div style="font-size: 10px; font-weight: 600; line-height: 1.15; margin-top: 3px">{{s.small}}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 50%; top: 50%; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; background: #FFFFFF; border: 5px solid #F2B705; box-shadow: 0 6px 16px rgba(0,0,0,.25), inset 0 0 0 3px #FFFFFF; box-sizing: border-box; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; width: 106px; height: 98px; overflow: hidden">
        <img src="/_blob/00057d2c0108ccd86df8a17eb0c7b52b" alt="Logo Credinstante" style="position: absolute; left: -7px; top: 6px; width: 121px; height: 121px; max-width: none">
      </div>
    </div>
    <div style="position: absolute; left: 50%; top: -18px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7A3, #F2B705 60%, #B57D05); border: 3px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 800; color: #FFFFFF; font-size: 20px">$</div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="position: relative; display: flex; gap: 8px; width: 100%; justify-content: center; margin-bottom: 14px">
    <div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; color: #123E8C; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.18)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E8B47" stroke-width="2.5" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
      2 giros disponibles
    </div>
    <div style="display: flex; align-items: center; gap: 6px; background: #FFF1BF; color: #0A1F4A; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.18)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B57D05" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Vence en 5 días
    </div>
  </div>
  <button style="position: relative; width: 100%; height: 60px; border: none; border-radius: 20px; background: #F2B705; color: #0A1F4A; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 #B57D05; cursor: pointer">¡Girar ahora!</button>
  <a href="#" style="position: relative; margin-top: 14px; font-size: 13px; color: #FFFFFF">¿Cómo gano más giros?</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const segs = [
      { big: '$5.000', small: 'Bono', fill: '#2E8B47', ink: '#FFFFFF' },
      { big: 'Cuota', small: 'Gratis', fill: '#CFEFC9', ink: '#123E8C' },
      { big: '-10%', small: 'En tu tasa', fill: '#123E8C', ink: '#FFFFFF' },
      { big: '¡Otra!', small: 'Girá de nuevo', fill: '#FFF1BF', ink: '#123E8C' },
      { big: '$10.000', small: 'Bono', fill: '#2E8B47', ink: '#FFFFFF' },
      { big: 'Kit', small: 'Credinstante', fill: '#CFEFC9', ink: '#123E8C' },
      { big: 'x2', small: 'Doble chance', fill: '#123E8C', ink: '#FFFFFF' },
      { big: 'GRAN', small: 'Premio', fill: '#F2B705', ink: '#0A1F4A' }
    ];
    const step = 360 / segs.length;
    const stops = segs.map((s, i) => s.fill + ' ' + (i*step) + 'deg ' + ((i+1)*step) + 'deg').join(', ');
    return {
      conic: 'conic-gradient(' + stops + ')',
      segments: segs.map((s, i) => ({ ...s, mid: i*step + step/2 })),
      leaves: Array.from({ length: 16 }, (_, i) => ({ deg: i*22.5 + 11, fill: i % 2 ? '#2E8B47' : '#7FC98B' }))
    };
  }
}
</script>
</body>
</html>
