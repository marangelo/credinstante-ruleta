<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ruleta Día Soleado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Heebo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B35}a:hover{color:#123E8C}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sun{animation:sunspin 30s linear infinite}
.sway{animation:sway 2.4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Heebo', system-ui, sans-serif; color: #0A1F4A; background: linear-gradient(180deg, #E3F3FF 0%, #F7FBF4 55%); display: flex; flex-direction: column; align-items: center; padding: 22px 20px 24px">
  <div class="sun" style="position: absolute; left: 50%; top: 395px; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; background: repeating-conic-gradient(rgba(242,183,5,.16) 0deg 9deg, rgba(242,183,5,0) 9deg 22deg)"></div>
  <div style="position: absolute; left: -80px; right: -80px; bottom: -270px; height: 420px; border-radius: 50%; background: #2E8B47"></div>
  <div style="position: absolute; left: -40px; right: -120px; bottom: -310px; height: 420px; border-radius: 50%; background: #1F6B35"></div>

  <div style="position: relative; display: flex; width: 100%; justify-content: space-between; align-items: center">
    <img src="/_blob/00057d2c0108ccd86df8a17eb0c7b52b" alt="Credinstante" style="width: 58px; height: 58px; object-fit: contain">
    <div style="display: flex; align-items: center; gap: 6px; background: #123E8C; color: #FFFFFF; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
      Promotor: [NOMBRE]
    </div>
  </div>

  <div style="position: relative; margin-top: 14px; width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; padding: 12px 16px; box-shadow: 0 6px 18px rgba(31,107,53,.14); display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #CFEFC9; color: #1F6B35; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; flex-shrink: 0">[AB]</div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #3D5A3F">Hoy gira</div>
      <div style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: #123E8C">[NOMBRE DEL CLIENTE]</div>
    </div>
  </div>

  <h1 style="position: relative; margin: 16px 0 0; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; text-align: center; color: #123E8C">¡Girá y <span style="color: #2E8B47">cosechá</span> tu premio!</h1>
  <div style="position: relative; margin-top: 6px; font-size: 14px; color: #2C3E50; text-align: center">No te muevas, nosotros iremos hasta tu casa</div>

  <div style="position: relative; width: 320px; height: 320px; margin-top: 22px; flex-shrink: 0">
    <sc-for list="{{leaves}}" as="l" hint-placeholder-count="16">
      <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate({{l.deg}}deg)">
        <svg width="34" height="22" viewBox="0 0 34 22" style="position: absolute; left: -17px; top: -177px" aria-hidden="true"><path d="M2 11 C 8 0, 26 0, 32 11 C 26 22, 8 22, 2 11 Z" fill="{{l.fill}}"></path><text x="17" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="Heebo, sans-serif">$</text></svg>
      </div>
    </sc-for>
    <div style="position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 16px 40px rgba(31,107,53,.28)"></div>
    <div style="position: absolute; inset: 10px; border-radius: 50%; overflow: hidden; border: 4px solid #F2B705; transform: rotate({{rot}}deg); transition: transform 4.6s cubic-bezier(.12,.72,.08,1); background: {{conic}}">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="8">
        <div style="position: absolute; inset: 0; transform: rotate({{s.mid}}deg); display: flex; justify-content: center">
          <div style="margin-top: 20px; width: 80px; text-align: center; color: {{s.ink}}">
            <div style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; line-height: 1">{{s.big}}</div>
            <div style="font-size: 10px; font-weight: 600; line-height: 1.15; margin-top: 3px">{{s.small}}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: #FFFFFF; border: 5px solid #F2B705; box-shadow: 0 6px 16px rgba(0,0,0,.25); box-sizing: border-box; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; width: 102px; height: 94px; overflow: hidden">
        <img src="/_blob/00057d2c0108ccd86df8a17eb0c7b52b" alt="Logo Credinstante" style="position: absolute; left: -7px; top: 5px; width: 117px; height: 117px; max-width: none">
      </div>
    </div>
    <div class="sway" style="position: absolute; left: 50%; top: -20px; width: 44px; height: 44px; margin-left: -22px; transform-origin: 50% 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7A3, #F2B705 60%, #B57D05); border: 3px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 800; color: #FFFFFF; font-size: 20px">$</div>
  </div>

  <div style="flex-grow: 1"></div>
  <sc-if value="{{hasResult}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 10px 18px; box-shadow: 0 4px 12px rgba(0,0,0,.18); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: #123E8C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E8B47" stroke-width="2.5" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      {{resultText}}
    </div>
  </sc-if>
  <button onClick="{{spin}}" style="position: relative; width: 100%; height: 60px; border: none; border-radius: 20px; background: #F2B705; color: #0A1F4A; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 #B57D05; cursor: pointer">{{btnLabel}}</button>
  <a href="#" style="position: relative; margin-top: 14px; font-size: 13px; color: #FFFFFF">Bases y condiciones</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { rot: 0, spinning: false, result: null }; }
  renderVals() {
    const segs = [
      { big: '$5.000', small: 'Bono', fill: '#2E8B47', ink: '#FFFFFF' },
      { big: 'Cuota', small: 'Gratis', fill: '#CFEFC9', ink: '#123E8C' },
      { big: '-10%', small: 'En tu tasa', fill: '#123E8C', ink: '#FFFFFF' },
      { big: '¡Otra!', small: 'Girá de nuevo', fill: '#FFF1BF', ink: '#123E8C' },
      { big: '$10.000', small: 'Bono', fill: '#2E8B47', ink: '#FFFFFF' },
      { big: 'Kit', small: 'Credinstante', fill: '#CFEFC9', ink: '#123E8C' },
      { big: 'x2', small: 'Doble chance', fill: '#123E8C', ink: '#FFFFFF' },
      { big: 'GRAN', small: 'Premio', fill: '#F2B705', ink: '#0A1F4A' }
    ];
    const n = segs.length, step = 360 / n;
    const stops = segs.map((s, i) => s.fill + ' ' + (i*step) + 'deg ' + ((i+1)*step) + 'deg').join(', ');
    const r = this.state.result;
    return {
      conic: 'conic-gradient(' + stops + ')',
      segments: segs.map((s, i) => ({ ...s, mid: i*step + step/2 })),
      leaves: Array.from({ length: 16 }, (_, i) => ({ deg: i*22.5 + 11, fill: i % 2 ? '#2E8B47' : '#7FC98B' })),
      rot: this.state.rot,
      hasResult: r !== null && !this.state.spinning,
      resultText: r !== null ? 'Salió: ' + segs[r].big + ' ' + segs[r].small : '',
      btnLabel: this.state.spinning ? 'Girando…' : '¡Girar ahora!',
      spin: () => {
        if (this.state.spinning) return;
        const target = this.state.rot + 360*6 + Math.floor(Math.random()*360);
        const idx = Math.floor(((360 - (target % 360)) % 360) / step) % n;
        this.setState({ rot: target, spinning: true });
        setTimeout(() => this.setState({ spinning: false, result: idx }), 4700);
      }
    };
  }
}
</script>
</body>
</html>
