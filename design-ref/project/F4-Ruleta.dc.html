<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ruleta de premios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Heebo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE7A3}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sway{animation:sway 2.4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Heebo', system-ui, sans-serif; color: #2C3E50; background: #F7FBF4; display: flex; flex-direction: column; align-items: center; padding: 24px 20px 24px">
  <div style="position: absolute; left: -80px; right: -80px; bottom: -260px; height: 420px; border-radius: 50%; background: #2E8B47"></div>
  <div style="position: absolute; left: -40px; right: -120px; bottom: -300px; height: 420px; border-radius: 50%; background: #1F6B35"></div>

  <div style="position: relative; width: 100%; display: flex; align-items: center; gap: 10px">
    <a href="F3-Cliente.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(31,107,53,.12)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#123E8C" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 6px 14px 6px 6px; box-shadow: 0 2px 8px rgba(31,107,53,.12)">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #CFEFC9; color: #1F6B35; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px">[AB]</div>
      <div style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #123E8C">[NOMBRE DEL CLIENTE]</div>
    </div>
    <div style="margin-left: auto; font-size: 13px; font-weight: 600; color: #3D5A3F">Paso 2/3</div>
  </div>

  <h1 style="position: relative; margin: 20px 0 0; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 32px; line-height: 1.05; text-align: center; color: #123E8C">¡Tu suerte<br><span style="color: #2E8B47">está creciendo!</span></h1>
  <div style="position: relative; margin-top: 8px; display: inline-flex; background: #86B817; color: #2C3E50; border-radius: 999px; padding: 5px 14px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px">Premios de $5 hasta $500</div>

  <div style="position: relative; width: 340px; height: 340px; margin-top: 26px; flex-shrink: 0">
    <sc-for list="{{leaves}}" as="l" hint-placeholder-count="16">
      <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate({{l.deg}}deg)">
        <svg width="34" height="22" viewBox="0 0 34 22" style="position: absolute; left: -17px; top: -187px" aria-hidden="true"><path d="M2 11 C 8 0, 26 0, 32 11 C 26 22, 8 22, 2 11 Z" fill="{{l.fill}}"></path><text x="17" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="Heebo, sans-serif">$</text></svg>
      </div>
    </sc-for>
    <div style="position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 16px 40px rgba(31,107,53,.28)"></div>
    <div style="position: absolute; inset: 10px; border-radius: 50%; overflow: hidden; border: 4px solid #F2B705; transform: rotate({{rot}}deg); transition: transform 5s cubic-bezier(.12,.72,.08,1); background: {{conic}}">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="12">
        <div style="position: absolute; inset: 0; transform: rotate({{s.mid}}deg); display: flex; justify-content: center">
          <div style="margin-top: 16px; width: 60px; text-align: center; color: {{s.ink}}; display: flex; flex-direction: column; align-items: center">
            <div style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 20px; line-height: 1">{{s.label}}</div>
            <div style="font-size: 9px; font-weight: 700; letter-spacing: .5px; margin-top: 2px">{{s.tag}}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: #FFFFFF; border: 5px solid #F2B705; box-shadow: 0 6px 16px rgba(0,0,0,.25); box-sizing: border-box; overflow: hidden">
      <div style="position: absolute; left: 0; top: 0; width: 102px; height: 94px; overflow: hidden">
        <img src="/_blob/00057d2c0108ccd86df8a17eb0c7b52b" alt="Logo Credinstante" style="position: absolute; left: -7px; top: 5px; width: 117px; height: 117px; max-width: none">
      </div>
    </div>
    <div class="sway" style="position: absolute; left: 50%; top: -20px; width: 46px; height: 46px; margin-left: -23px; transform-origin: 50% 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7A3, #F2B705 60%, #B57D05); border: 3px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 900; color: #FFFFFF; font-size: 21px">$</div>
  </div>

  <div style="flex-grow: 1"></div>
  <sc-if value="{{hasResult}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 10px 20px; box-shadow: 0 4px 12px rgba(0,0,0,.18); font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; color: #123E8C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E8B47" stroke-width="3" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      ¡Ganó {{resultText}}!
    </div>
    <a href="F5-Premio.dc.html" style="position: relative; width: 100%; height: 60px; border-radius: 20px; background: #F2B705; color: #0A1F4A; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 21px; box-shadow: 0 6px 0 #B57D05; display: flex; align-items: center; justify-content: center; text-decoration: none">Ver premio</a>
  </sc-if>
  <sc-if value="{{showSpin}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{spin}}" style="position: relative; width: 100%; height: 60px; border: none; border-radius: 20px; background: #F2B705; color: #0A1F4A; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px; box-shadow: 0 6px 0 #B57D05; cursor: pointer">{{btnLabel}}</button>
  </sc-if>
  <a href="F8-SinConexion.dc.html" style="position: relative; margin-top: 12px; font-size: 13px">Ver ejemplo: sin conexión</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { rot: 0, spinning: false, result: null }; }
  renderVals() {
    const amounts = ['$5','$50','$10','$100','$15','$250','$20','$75','$25','$500','$30','$40'];
    const pal = [
      { fill: '#2E8B47', ink: '#FFFFFF' }, { fill: '#FFF1BF', ink: '#123E8C' },
      { fill: '#123E8C', ink: '#FFFFFF' }, { fill: '#CFEFC9', ink: '#123E8C' }
    ];
    const n = amounts.length, step = 360 / n;
    const segs = amounts.map((label, i) => {
      const gran = label === '$500';
      const c = gran ? { fill: '#F2B705', ink: '#0A1F4A' } : pal[i % 4];
      return { label, tag: gran ? 'GRAN PREMIO' : '', ...c, mid: i*step + step/2 };
    });
    const stops = segs.map((s, i) => s.fill + ' ' + (i*step) + 'deg ' + ((i+1)*step) + 'deg').join(', ');
    const r = this.state.result;
    const done = r !== null && !this.state.spinning;
    return {
      conic: 'conic-gradient(' + stops + ')',
      segments: segs,
      leaves: Array.from({ length: 16 }, (_, i) => ({ deg: i*22.5 + 11, fill: i % 2 ? '#2E8B47' : '#7FC98B' })),
      rot: this.state.rot,
      hasResult: done,
      showSpin: !done,
      resultText: r !== null ? amounts[r] : '',
      btnLabel: this.state.spinning ? 'Girando…' : '¡Girar ahora!',
      spin: () => {
        if (this.state.spinning) return;
        const target = this.state.rot + 360*6 + Math.floor(Math.random()*360);
        const idx = Math.floor(((360 - (target % 360)) % 360) / step) % n;
        this.setState({ rot: target, spinning: true });
        setTimeout(() => this.setState({ spinning: false, result: idx }), 5100);
      }
    };
  }
}
</script>
</body>
</html>
